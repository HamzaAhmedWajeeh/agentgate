# Mirrors the CI gate. If pre-commit passes, CI should too.
# Install once with: pre-commit install
#
# No default_language_version is pinned: the hook interpreter only has to run the hooks,
# and pinning it breaks on machines where the 3.12 executable is not on PATH under that
# exact name. The interpreter that matters is the locked one mypy runs under, below.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs against the locked environment rather than an isolated one, so the
  # types it checks against are the types that actually ship.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^(uv\.lock|\.secrets\.baseline)$
